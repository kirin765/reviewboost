<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 600px; overflow: hidden; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #0f2440;
    color: #fff;
  }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  /* header */
  .head {
    background: linear-gradient(135deg, #2b6cb0 0%, #1a3a6b 60%, #0f2440 100%);
    padding: 34px 42px 26px;
    border-bottom: 3px solid #4f9de0;
  }
  .head h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    margin-bottom: 8px; line-height: 1.3;
  }
  .head h1 .accent { color: #7ec8ff; }
  .head p { font-size: 15px; color: #cfe4f7; font-weight: 600; }
  .head p b { color: #fff; }
  /* body */
  .body { flex: 1; display: flex; gap: 0; }
  .features {
    width: 300px; padding: 26px 22px 18px 30px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .feat { display: flex; gap: 12px; align-items: flex-start; }
  .num {
    flex: 0 0 34px; height: 34px; border-radius: 50%;
    background: #4f9de0; color: #0f2440; font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .feat h3 { font-size: 17px; margin-bottom: 3px; color: #fff; }
  .feat p { font-size: 13px; color: #b9cfe4; line-height: 1.5; }
  /* screenshots column */
  .shots {
    flex: 1; padding: 24px 26px 0 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .shot-main { position: relative; }
  .shot-main img {
    width: 100%; border-radius: 8px;
    border: 2px solid #2e5a8f; display: block;
  }
  .shot-thumbs { display: flex; gap: 10px; }
  .shot-thumbs img {
    width: calc(50% - 5px); border-radius: 6px;
    border: 2px solid #2e5a8f; display: block;
  }
  /* footer */
  .foot {
    background: #0a1a30;
    padding: 16px 42px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 2px solid #1c3a5e;
  }
  .foot .price { font-size: 20px; font-weight: 800; color: #7ec8ff; }
  .foot .price small { font-size: 13px; color: #b9cfe4; font-weight: 600; }
  .foot .cta {
    background: #ffb020; color: #0f2440;
    font-size: 15px; font-weight: 800;
    padding: 9px 18px; border-radius: 6px;
  }
</style>
</head>
